<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#112240">
  <title>Reconnect · Campus Cart</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px 20px; background: #0a192f; color: #ccd6f6; font: 17px/1.6 Arial, sans-serif; }
    main { max-width: 440px; margin: 12vh auto 0; }
    h1 { color: #64ffda; font-size: 1.7rem; line-height: 1.2; }
    a, button { display: inline-block; padding: 11px 18px; border: 1px solid #64ffda; border-radius: 9px; background: #64ffda; color: #0a192f; font: bold 16px Arial, sans-serif; text-decoration: none; cursor: pointer; }
    a { margin: 10px 0 0 8px; background: transparent; color: #64ffda; }
  </style>
</head>
<body>
  <main>
    <h1>Let's get you connected</h1>
    <p>This page isn't saved on your device yet. Connect to the internet, then try again.</p>
    <button type="button" id="retry">Try again</button>
    <a href="./index.html">Open shop</a>
  </main>
  <script>
    document.getElementById('retry').addEventListener('click', function () { location.reload(); });
    window.addEventListener('online', function () { location.reload(); });
  </script>
</body>
</html>
